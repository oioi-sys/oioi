<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Colors</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --border: #2a3248;
    --text: #e2e8f0;
    --text2: #8b9cbf;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
  }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .swatch {
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .fill { height: 64px; }
  .label { padding: 8px 10px; background: var(--bg2); font-size: 12px; }
  .name { font-weight: 600; }
  .value { color: var(--text2); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>Color tokens</h1>
  <div class="grid">
    <div class="swatch"><div class="fill" style="background:var(--bg)"></div><div class="label"><div class="name">bg</div><div class="value">#0f1117</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--bg2)"></div><div class="label"><div class="name">bg2</div><div class="value">#161b27</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--bg3)"></div><div class="label"><div class="name">bg3</div><div class="value">#1e2535</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--border)"></div><div class="label"><div class="name">border</div><div class="value">#2a3248</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--text)"></div><div class="label"><div class="name">text</div><div class="value">#e2e8f0</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--text2)"></div><div class="label"><div class="name">text2</div><div class="value">#8b9cbf</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--accent)"></div><div class="label"><div class="name">accent</div><div class="value">#3b82f6</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--green)"></div><div class="label"><div class="name">green</div><div class="value">#22c55e</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--red)"></div><div class="label"><div class="name">red</div><div class="value">#ef4444</div></div></div>
    <div class="swatch"><div class="fill" style="background:var(--yellow)"></div><div class="label"><div class="name">yellow</div><div class="value">#eab308</div></div></div>
  </div>
</body>
</html>
