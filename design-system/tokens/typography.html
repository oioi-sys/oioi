<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Typography</title>
<style>
  :root {
    --bg: #0f1117; --bg2: #161b27; --border: #2a3248;
    --text: #e2e8f0; --text2: #8b9cbf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
  }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .tag { width: 220px; font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
  .price-xl { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .title { font-size: 16px; font-weight: 600; }
  .body-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
  .body { font-size: 13px; }
  .meta { font-size: 11px; color: var(--text2); }
</style>
</head>
<body>
  <h1>Type scale</h1>
  <div class="row"><span class="tag">price-xl / 42 / 700</span><span class="price-xl">146.80</span></div>
  <div class="row"><span class="tag">title / 16 / 600</span><span class="title">Card title</span></div>
  <div class="row"><span class="tag">label / 12 / 600 uppercase</span><span class="body-label">Sector</span></div>
  <div class="row"><span class="tag">body / 13 / 400</span><span class="body">Company description and news summary copy.</span></div>
  <div class="row"><span class="tag">meta / 11 / 400</span><span class="meta">Updated 14:32:01</span></div>
</body>
</html>
