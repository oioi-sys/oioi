<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Error banner</title>
<style>
  :root { --bg: #0f1117; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #e2e8f0; }
  .error-banner {
    background: #7c1d1d; color: #fca5a5; text-align: center; padding: 8px; font-size: 13px;
    border-radius: 6px; max-width: 480px;
  }
</style>
</head>
<body>
  <h1>Error banner</h1>
  <div class="error-banner">Unable to refresh data &mdash; retrying&hellip;</div>
</body>
</html>
