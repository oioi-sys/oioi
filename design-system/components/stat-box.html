<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stat box</title>
<style>
  :root {
    --bg: #0f1117; --bg2: #161b27; --bg3: #1e2535; --border: #2a3248;
    --text: #e2e8f0; --text2: #8b9cbf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
  .price-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 460px; }
  .stat-box { background: var(--bg3); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); }
  .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>Stat box</h1>
  <div class="price-stats">
    <div class="stat-box"><div class="stat-label">Prev Close</div><div class="stat-value">145.20</div></div>
    <div class="stat-box"><div class="stat-label">Day High</div><div class="stat-value">148.10</div></div>
    <div class="stat-box"><div class="stat-label">Day Low</div><div class="stat-value">144.60</div></div>
    <div class="stat-box"><div class="stat-label">Volume</div><div class="stat-value">1.24M</div></div>
  </div>
</body>
</html>
