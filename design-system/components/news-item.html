<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>News item</title>
<style>
  :root {
    --bg: #0f1117; --bg2: #161b27; --border: #2a3248;
    --text: #e2e8f0; --text2: #8b9cbf; --accent: #3b82f6;
    --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
  .card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); max-width: 380px;
  }
  .news-list { display: flex; flex-direction: column; gap: 1px; }
  .news-item { padding: 14px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .news-item:last-child { border-bottom: none; padding-bottom: 0; }
  .news-item:first-child { padding-top: 0; }
  .news-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 4px; background: var(--border); }
  .news-title { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .news-title a { color: inherit; text-decoration: none; }
  .news-summary { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .news-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text2); }
  .news-publisher { font-weight: 600; }
  .news-dot { opacity: 0.5; }
</style>
</head>
<body>
  <h1>News item</h1>
  <div class="card">
    <div class="news-list">
      <div class="news-item">
        <div class="news-thumb"></div>
        <div class="news-title"><a href="#">DOF Group secures new subsea contract in the North Sea</a></div>
        <div class="news-summary">The company announced a multi-year charter agreement extending its offshore vessel operations.</div>
        <div class="news-meta">
          <span class="news-publisher">Reuters</span>
          <span class="news-dot">&bull;</span>
          <span class="news-time">2h ago</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
